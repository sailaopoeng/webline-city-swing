AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Webline City Swing static hosting: private S3 bucket behind CloudFront (OAC),
  ACM certificate, optional Route 53 alias records, and a GitHub Actions OIDC
  deploy role. Deploy this stack in us-east-1 (CloudFront requires its ACM
  certificate there).

Parameters:
  DomainName:
    Type: String
    Default: webline-city-swing.sailaopoeng.com
    Description: Public hostname served by CloudFront.
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: Route 53 hosted zone that owns DomainName (used for ACM validation and alias records).
  CreateDnsRecords:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
    Description: >
      Create A/AAAA alias records for DomainName. Leave false until the existing
      record that points at the ChatGPT site has been removed, then update to true.
  GitHubRepository:
    Type: String
    Default: sailaopoeng/webline-city-swing
    Description: owner/repo allowed to assume the deploy role.
  GitHubBranch:
    Type: String
    Default: main
    Description: Branch allowed to deploy.
  GitHubOwnerId:
    Type: String
    Default: '1961912'
    Description: >
      Numeric GitHub account ID of the repository owner. GitHub puts it in the OIDC
      subject (repo:owner@ID/name@ID:...). Leave empty for the older name-only subject.
  GitHubRepositoryId:
    Type: String
    Default: '1377197541'
    Description: Numeric GitHub repository ID used with GitHubOwnerId.
  ExistingGitHubOidcProviderArn:
    Type: String
    Default: ''
    Description: >
      ARN of an existing token.actions.githubusercontent.com OIDC provider in this
      account. Leave empty to create one (an account can only have one).

Conditions:
  ShouldCreateDnsRecords: !Equals [!Ref CreateDnsRecords, 'true']
  ShouldCreateOidcProvider: !Equals [!Ref ExistingGitHubOidcProviderArn, '']
  UseIdPinnedSubject: !Not
    - !Or
      - !Equals [!Ref GitHubOwnerId, '']
      - !Equals [!Ref GitHubRepositoryId, '']

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30

  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub 'Webline City Swing (${DomainName})'
        Aliases:
          - !Ref DomainName
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        # Includes Asia edges (Singapore, Hong Kong, Japan, India); excludes the costlier South America and Oceania.
        PriceClass: PriceClass_200
        Origins:
          - Id: SiteBucketOrigin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: SiteBucketOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          # Managed-CachingOptimized; deploys invalidate /* so new files show immediately.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          # Managed-SecurityHeadersPolicy (HSTS, nosniff, frame options, referrer policy).
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

  AliasRecordA:
    Type: AWS::Route53::RecordSet
    Condition: ShouldCreateDnsRecords
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2 # Fixed hosted zone ID for all CloudFront distributions.

  AliasRecordAAAA:
    Type: AWS::Route53::RecordSet
    Condition: ShouldCreateDnsRecords
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Assumed by GitHub Actions to publish Webline City Swing.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - ShouldCreateOidcProvider
                - !Ref GitHubOidcProvider
                - !Ref ExistingGitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !If
                  - UseIdPinnedSubject
                  - !Sub
                    - 'repo:${Owner}@${GitHubOwnerId}/${Name}@${GitHubRepositoryId}:ref:refs/heads/${GitHubBranch}'
                    - Owner: !Select [0, !Split ['/', !Ref GitHubRepository]]
                      Name: !Select [1, !Split ['/', !Ref GitHubRepository]]
                  - !Sub 'repo:${GitHubRepository}:ref:refs/heads/${GitHubBranch}'
      Policies:
        - PolicyName: PublishSite
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt SiteBucket.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub '${SiteBucket.Arn}/*'
              - Effect: Allow
                Action: [cloudfront:CreateInvalidation, cloudfront:GetInvalidation]
                Resource: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

Outputs:
  BucketName:
    Description: Set as the AWS_S3_BUCKET repository variable.
    Value: !Ref SiteBucket
  DistributionId:
    Description: Set as the AWS_CLOUDFRONT_DISTRIBUTION_ID repository variable.
    Value: !Ref Distribution
  DistributionDomainName:
    Description: Test the site here before switching DNS.
    Value: !GetAtt Distribution.DomainName
  DeployRoleArn:
    Description: Set as the AWS_DEPLOY_ROLE_ARN repository variable.
    Value: !GetAtt GitHubDeployRole.Arn
